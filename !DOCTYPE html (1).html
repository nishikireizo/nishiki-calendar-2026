<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニシキ冷蔵株式会社 - 2026年 年間休日案内</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme: #1C2F8C;
    --theme-light: #E8EBF6;
    --theme-dark: #0F1A52;
    --text: #333;
    --text-muted: #888;
    --text-faint: #aaa;
    --border: #e0e0dd;
    --bg-page: #f4f3ee;
    --bg-card: #fafaf7;
  }

  body {
    font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg-page);
    color: var(--text);
    padding: 40px 20px;
    line-height: 1.5;
    font-weight: 400;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 56px 48px;
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 24px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 40px;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block .year {
    font-size: 56px;
    font-weight: 300;
    color: var(--theme);
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .title-block .label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    font-weight: 500;
    text-transform: uppercase;
  }

  .title-block .label-jp {
    font-size: 14px;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-top: 4px;
    font-weight: 500;
  }

  .company-block {
    text-align: right;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.8;
    letter-spacing: 0.02em;
  }

  .company-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--theme);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  /* ===== Year grid ===== */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px 32px;
  }

  .month {
    display: flex;
    flex-direction: column;
  }

  .month-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--theme);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    padding-left: 2px;
  }

  /* ===== Calendar table ===== */
  .cal-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
  }

  .cal-table thead th {
    color: var(--text-faint);
    font-weight: 400;
    padding: 6px 0 10px;
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .cal-table thead th.sun { color: #b85450; }
  .cal-table thead th.sat { color: var(--theme); opacity: 0.6; }

  .cal-table td {
    text-align: center;
    vertical-align: middle;
    height: 34px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    position: relative;
  }

  .cal-table td.empty { color: transparent; }

  /* Holiday cell: filled circle */
  .cal-table td.holiday {
    color: #fff;
    font-weight: 600;
  }

  .cal-table td.holiday::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 26px;
    height: 26px;
    background: var(--theme);
    border-radius: 50%;
    z-index: 0;
  }

  .cal-table td.holiday span {
    position: relative;
    z-index: 1;
  }

  /* Saturday half-day: half-filled circle + dual-color number */
  .cal-table td.sat-half {
    font-weight: 600;
  }

  .cal-table td.sat-half::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 26px;
    height: 26px;
    background: linear-gradient(to bottom, var(--theme) 50%, transparent 50%);
    border: 1.5px solid var(--theme);
    border-radius: 50%;
    z-index: 0;
  }

  .cal-table td.sat-half .num-dual {
    position: relative;
    z-index: 1;
    display: inline-block;
    background: linear-gradient(to bottom, #ffffff 50%, var(--theme) 50%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }

  /* ===== Legend / Footer ===== */
  .legend {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 0.5px solid var(--border);
    font-size: 13px;
    color: var(--text);
    line-height: 1.8;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .legend-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: var(--theme);
    color: #fff;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .legend-half {
    display: inline-block;
    position: relative;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .legend-half::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, var(--theme) 50%, transparent 50%);
    border: 1.5px solid var(--theme);
    border-radius: 50%;
  }

  .legend strong {
    color: var(--theme);
    font-weight: 600;
  }

  .legend-note {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 8px;
  }

  .legend-note strong {
    color: var(--theme);
    font-weight: 600;
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .year-grid { grid-template-columns: repeat(2, 1fr); gap: 28px 24px; }
    .container { padding: 40px 28px; }
    .title-block .year { font-size: 44px; }
  }

  @media (max-width: 560px) {
    .year-grid { grid-template-columns: 1fr; gap: 28px; }
    body { padding: 20px 12px; }
    .container { padding: 28px 20px; border-radius: 12px; }
    .header { flex-direction: column; align-items: flex-start; }
    .company-block { text-align: left; }
    .title-block .year { font-size: 40px; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .container { padding: 24px; background: #fff; }
    .cal-table td.holiday::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="title-block">
      <div class="year">2026</div>
      <div class="label">Annual Holiday Calendar</div>
      <div class="label-jp">年間休日案内</div>
    </div>
    <div class="company-block">
      <div class="company-name">ニシキ冷蔵株式会社</div>
      <div>〒799-3111</div>
      <div>愛媛県伊予市下吾川1968番地1</div>
      <div>TEL: 089-983-0026 / FAX: 089-983-0034</div>
      <div>info@nishikireizo.com</div>
    </div>
  </header>

  <!-- Year grid -->
  <div class="year-grid" id="yearGrid"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-row">
      <span class="legend-circle">●</span>
      <span>印の日は土曜、日曜、祝日を含む当社休日です。</span>
    </div>
    <div class="legend-row">
      <span class="legend-half"></span>
      <span>印の土曜日は<strong>午前中のみ</strong>の営業とさせて頂きます。</span>
    </div>
  </div>

</div>

<script>
  // ===== Holiday data extracted from Nishiki Reizo 2026 PDF =====
  // Each array lists the dates that are company holidays (●印)
  const holidays = {
    1:  [1, 2, 3, 4, 10, 11, 12, 17, 18, 24, 25, 31],
    2:  [1, 7, 8, 11, 14, 15, 21, 22, 23, 28],
    3:  [1, 7, 8, 14, 15, 20, 21, 22, 28, 29],
    4:  [4, 5, 11, 12, 18, 19, 25, 26, 29],
    5:  [3, 4, 5, 6, 10, 16, 17, 23, 24, 30, 31],
    6:  [6, 7, 13, 14, 20, 21, 27, 28],
    7:  [4, 5, 11, 12, 19, 20, 26],
    8:  [1, 2, 9, 11, 12, 13, 14, 15, 16, 22, 23, 29, 30],
    9:  [5, 6, 12, 13, 19, 20, 21, 22, 23, 27],
    10: [3, 4, 10, 11, 12, 17, 18, 24, 25, 31],
    11: [1, 3, 8, 14, 15, 22, 23, 28, 29],
    12: [5, 6, 13, 20, 27, 29, 30, 31]
  };

  const daysInMonth = {
    1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30,
    7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31
  };

  const dowLabels = ['日', '月', '火', '水', '木', '金', '土'];
  const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function buildMonth(month) {
    const year = 2026;
    const firstDay = new Date(year, month - 1, 1).getDay();
    const totalDays = daysInMonth[month];
    const holidaySet = new Set(holidays[month]);

    let html = `<div class="month">`;
    html += `<div class="month-title">${monthLabels[month - 1]}</div>`;
    html += `<table class="cal-table"><thead><tr>`;
    dowLabels.forEach((d, i) => {
      const cls = i === 0 ? 'sun' : (i === 6 ? 'sat' : '');
      html += `<th class="${cls}">${d}</th>`;
    });
    html += `</tr></thead><tbody>`;

    let day = 1;
    let started = false;
    for (let week = 0; week < 6; week++) {
      let rowHtml = '<tr>';
      let rowHasContent = false;
      for (let dow = 0; dow < 7; dow++) {
        if (!started && dow === firstDay) started = true;
        if (started && day <= totalDays) {
          const isHoliday = holidaySet.has(day);
          const isSatHalf = (dow === 6) && !isHoliday;
          if (isHoliday) {
            rowHtml += `<td class="holiday"><span>${day}</span></td>`;
          } else if (isSatHalf) {
            rowHtml += `<td class="sat-half"><span class="num-dual">${day}</span></td>`;
          } else {
            rowHtml += `<td>${day}</td>`;
          }
          day++;
          rowHasContent = true;
        } else {
          rowHtml += `<td class="empty"></td>`;
        }
      }
      rowHtml += '</tr>';
      if (rowHasContent) html += rowHtml;
      if (day > totalDays) break;
    }
    html += `</tbody></table></div>`;
    return html;
  }

  const grid = document.getElementById('yearGrid');
  let allHtml = '';
  for (let m = 1; m <= 12; m++) {
    allHtml += buildMonth(m);
  }
  grid.innerHTML = allHtml;
</script>

</body>
</html>
